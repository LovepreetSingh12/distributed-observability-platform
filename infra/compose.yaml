name: observatory
x-backend: &backend
  build:
    context: ..
    dockerfile: infra/backend.Dockerfile
  environment: &env
    MONGO_URI: mongodb://mongo:27017/observatory?replicaSet=rs0
    KAFKA_BOOTSTRAP: kafka:19092
    JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m
  restart: unless-stopped
services:
  mongo:
    image: mongo:8.0.15
    command: [mongod, --replSet, rs0, --bind_ip_all]
    volumes: [mongo-data:/data/db]
    ports: [127.0.0.1:27017:27017]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
  mongo-init:
    image: mongo:8.0.15
    depends_on:
      mongo: {condition: service_healthy}
    entrypoint: [bash, -c]
    command:
      - >-
        mongosh --host mongo --quiet --eval 'try { rs.status() } catch(e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}) }';
        until mongosh --host mongo --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; do sleep 1; done
  kafka:
    image: apache/kafka:4.0.1
    ports: [127.0.0.1:9092:9092]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_RETENTION_HOURS:-168}
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null]
      interval: 10s
      timeout: 10s
      retries: 30
  kafka-init:
    image: apache/kafka:4.0.1
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: [bash, -c]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic events.ingested.v1 --partitions 3 --replication-factor 1 --config retention.ms=${KAFKA_RETENTION_MS:-604800000} &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic events.dlq.v1 --partitions 3 --replication-factor 1 --config retention.ms=${DLQ_RETENTION_MS:-1209600000}
  platform:
    <<: *backend
    build: {context: .., dockerfile: infra/backend.Dockerfile, args: {MODULE: platform-service}}
    environment:
      <<: *env
      DEMO_SEED: 'true'
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Run scripts/demo.sh first}
      DEMO_API_KEY: ${DEMO_API_KEY:?Run scripts/demo.sh first}
    ports: [127.0.0.1:8080:8080]
    depends_on:
      mongo-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/actuator/health]
      interval: 10s
      timeout: 5s
      retries: 30
  ingestion:
    <<: *backend
    build: {context: .., dockerfile: infra/backend.Dockerfile, args: {MODULE: ingestion-service}}
    ports: [127.0.0.1:8081:8081]
    depends_on:
      platform: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8081/actuator/health]
      interval: 10s
      timeout: 5s
      retries: 30
  worker:
    <<: *backend
    build: {context: .., dockerfile: infra/backend.Dockerfile, args: {MODULE: storage-worker}}
    depends_on:
      platform: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8082/actuator/health]
      interval: 10s
      timeout: 5s
      retries: 30
  sample:
    <<: *backend
    build: {context: .., dockerfile: infra/backend.Dockerfile, args: {MODULE: sample-application}}
    environment:
      <<: *env
      DEMO_API_KEY: ${DEMO_API_KEY}
      INGESTION_URL: http://ingestion:8081/api/v1/events/batch
    ports: [127.0.0.1:8083:8083]
    depends_on:
      ingestion: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8083/actuator/health]
      interval: 10s
      timeout: 5s
      retries: 30
  frontend:
    build: {context: .., dockerfile: infra/frontend.Dockerfile}
    ports: [127.0.0.1:5173:80]
    depends_on:
      platform: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  mongo-data:
  kafka-data:
